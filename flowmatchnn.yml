name: flowmatchnn
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - matplotlib
  - tqdm
  - pip
  - pip:
      - pot        # exact W_1 (ot.emd2) + minibatch-OT coupling
      - pytest     # test/ suite (NTK closed-form validation etc.)
